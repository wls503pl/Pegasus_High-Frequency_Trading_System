name: Pegasus CI

on:
  push:
    branches:
      - main
      - master
      - outstanding_projects
  pull_request:
    branches:
      - main
      - master
      - outstanding_projects
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pegasus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            cc: gcc
            build_type: Release
          - compiler: gcc
            cxx: g++
            cc: gcc
            build_type: Debug
          - compiler: clang
            cxx: clang++
            cc: clang
            build_type: Release

    env:
      BUILD_DIR: build-${{ matrix.compiler }}-${{ matrix.build_type }}
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            ninja-build

      - name: Print toolchain versions
        run: |
          cmake --version
          ninja --version
          $CC --version
          $CXX --version

      - name: Configure CMake
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE"

      - name: Build all targets
        run: |
          cmake --build "$BUILD_DIR" --parallel

      - name: Run Phase 1 test suite
        run: |
          cmake --build "$BUILD_DIR" --target run_phase1 --parallel

      - name: Upload failed build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pegasus-${{ matrix.compiler }}-${{ matrix.build_type }}-failure
          path: |
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
